[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim_cea"
version = "0.1.0"
description = "Surcouche Manim au style CEA (logo, cube, footer, listes, vidéo)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "CEA" }]
dependencies = [
    "manim>=0.18",
    "opencv-python",
    "Pillow",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["manim_cea*"]

[tool.setuptools.package-data]
manim_cea = ["graphics/*.png", "tex/*.tex"]
